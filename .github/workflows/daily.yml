name: Taeglicher Radar-Lauf

on:
  schedule:
    # GitHub startet geplante Läufe unzuverlässig (Stunden zu spät oder gar
    # nicht). Deshalb zehn Startversuche Di-Sa zwischen 03:17 und 07:47 UTC
    # (05:17-09:47 Uhr Berlin Sommerzeit). Der erste erfolgreiche Lauf des
    # Tages aktualisiert die Seite, alle weiteren beenden sich nach Sekunden.
    # Zusaetzlich stoesst ein externer Zeitplan den Lauf ueber eine Aenderung
    # an trigger/last.txt an (Commit-Nachricht mit "[trigger]").
    # Di-Sa: jeweils mit dem Schlusskurs des Vortags (Samstag = Freitagsschluss).
    - cron: "17,47 3-7 * * 2-6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["radar/**", "requirements.txt", ".github/workflows/daily.yml", "trigger/**",
            "data/fairvalue.json"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Heute schon aktualisiert?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          today=$(date -u +%F)
          auto=false
          [ "$EVENT" = "schedule" ] && auto=true
          case "$MSG" in *"[trigger]"*) auto=true;; esac
          if [ "$EVENT" = "push" ] && case "$MSG" in *"[fairvalue]"*) true;; *) false;; esac; then
            echo "Nur Fair-Value-Nachtrag."
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "mode=enrich" >> "$GITHUB_OUTPUT"
          elif [ "$auto" = true ] && [ -f "data/history/${today}.json" ]; then
            echo "Radar fuer ${today} existiert bereits - nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Kurs-Cache laden
        if: steps.guard.outputs.mode == 'full'
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Fair-Value-Nachtrag einbinden
        if: steps.guard.outputs.mode == 'enrich'
        run: python -m radar.fairvalue

      - name: Radar ausfuehren
        if: steps.guard.outputs.mode == 'full'
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p data
          set -o pipefail
          python -m radar.run 2>&1 | tee data/run.log

      - name: Kurs-Cache sichern
        if: always() && steps.guard.outputs.mode == 'full'
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: prices-${{ github.run_id }}

      - name: Ergebnis speichern und veroeffentlichen
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Radar $(date -u +%Y-%m-%d) (${{ steps.guard.outputs.mode }})"
          git pull --rebase -X theirs origin main
          git push
